# Orca worktree setup (docs/PLAN.md §6.2). Agent instructions live in AGENTS.md, not here.
scripts:
  # Walk past the bash wrapper to hang up the tab shell after setup succeeds.
  setup: |
    uv sync --all-groups && npm ci --prefix frontend && uv run pre-commit install --install-hooks -t pre-commit -t pre-push &&
      p=$$; while [ "$p" -gt 1 ]; do pp=$(ps -o ppid= -p "$p" | tr -d " "); case "$(ps -o comm= -p "$pp")" in login|*/login) kill -HUP "$p"; break;; esac; p=$pp; done
