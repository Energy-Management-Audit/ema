name: CI

on:
  push:
    branches: [prod, dev]
  pull_request:
    branches: [prod, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    # Golden tests are not run here: they read the real client material, which
    # never leaves the auditor's machines (docs/PLAN.md 5.15, 5.16).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-groups

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: File size
        run: git ls-files '*.py' | xargs -r uv run python scripts/check_file_size.py

      - name: Types
        run: uv run pyright

      - name: Import contracts
        run: uv run lint-imports

      - name: Unit tests
        run: uv run pytest -m "not golden"
