name: CI

on:
  push:
    branches: [prod, dev]
  pull_request:
    branches: [prod, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    # Golden tests are not run here: they read the real client material, which
    # never leaves the auditor's machines (docs/PLAN.md 5.15, 5.16).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-groups

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend
        run: npm ci --prefix frontend

      - name: Install the e2e browser
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Complete check
        run: scripts/check
