name: Windows build

on:
  push:
    tags: ["v*"]
    branches: [dev]
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/windows.yml"
      - "resources/**"
      - "src/ema/__init__.py"
  pull_request:
    branches: [dev]
    paths:
      - "packaging/**"
      - ".github/workflows/windows.yml"
      - "src/ema/windows/**"
      - "src/ema/cli/desktop.py"
      - "src/ema/cli/install_check.py"
      - "src/ema/core/pdf.py"
      - "resources/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      unit_tests:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  unit:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.unit_tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen --all-groups
      - run: uv run pytest -m "not golden and not network"
      - run: uv run pyright

  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require prod ancestry for release tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          git fetch origin prod
          git merge-base --is-ancestor $env:GITHUB_SHA origin/prod
          if ($LASTEXITCODE -ne 0) { throw 'tag is not on prod' }
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - shell: pwsh
        run: ./packaging/fetch_tesseract.ps1
      - run: uv sync --frozen --no-dev --group packaging
      - run: uv run --no-sync pyinstaller packaging/ema.spec --noconfirm --distpath build/dist --workpath build/work
      - name: Verify frozen version
        id: version
        shell: pwsh
        run: |
          $source = (uv run --no-sync python -c "import ema; print(ema.__version__)").Trim()
          $project = (uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])").Trim()
          $frozen = (& 'build\dist\Ema\ema-cli.exe' --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -ne $project -or $source -ne $frozen) {
            throw "Version mismatch: source=$source project=$project frozen=$frozen"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $source -ne $env:GITHUB_REF_NAME.TrimStart('v')) {
            throw 'Tag version mismatch'
          }
          "version=$source" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          $expected = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $setup = Join-Path $env:RUNNER_TEMP 'inno-setup.exe'
          $install = Join-Path $env:RUNNER_TEMP 'inno'
          Invoke-WebRequest $url -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Inno Setup SHA256 mismatch'
          }
          $process = Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR=$install" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup install failed: $($process.ExitCode)" }
          $compiler = Get-ChildItem $install -Filter ISCC.exe -Recurse | Select-Object -First 1
          if (-not $compiler) { throw 'ISCC.exe missing from Inno Setup installation' }
          "ISCC=$($compiler.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build installer
        shell: pwsh
        run: '& $env:ISCC "/DAppVersion=${{ steps.version.outputs.version }}" packaging\ema.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: Ema-Setup-${{ steps.version.outputs.version }}
          path: build/installer/Ema-Setup-${{ steps.version.outputs.version }}.exe
          retention-days: 14
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: Ema-Setup-${{ needs.build.outputs.version }}
          path: build/installer
      - name: Install, exercise, and uninstall
        shell: pwsh
        run: ./packaging/smoke.ps1

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: Ema-Setup-${{ needs.build.outputs.version }}
      - name: Publish installer and annotated release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then echo 'RELEASES_TOKEN is not set' >&2; exit 1; fi
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          if [[ ! -s notes.md ]]; then echo 'release notes missing' >&2; exit 1; fi
          gh release create "$GITHUB_REF_NAME" "Ema-Setup-${{ needs.build.outputs.version }}.exe" \
            --repo Energy-Management-Audit/ema-releases \
            --title "Ema ${{ needs.build.outputs.version }}" --notes-file notes.md
