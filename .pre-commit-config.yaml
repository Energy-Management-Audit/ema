# Commit hooks may fix; pre-push delegates to the same non-mutating check as CI.
# Install once with: uv run pre-commit install --install-hooks -t pre-commit -t pre-push
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
        args: [--maxkb=2048]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        stages: [pre-commit]
        args: [--fix]
      - id: ruff-format
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: check-pre-push
        name: complete check
        entry: bash scripts/check
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
