[project]
name = "ema"
version = "0.1.0"
description = "Ema — assistant for Energy Management & Audit SRL: invoices, PIEE, energy audits, energy-manager reporting"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    # interfaces
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # office documents
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "xlrd>=2.0",          # legacy .xls, read-only
    "olefile>=0.47",      # inspect legacy Office streams without trusting extensions
    "lxml>=5.2",          # chart parts and raw OOXML work
    # pdf + ocr (permissive licences only — no PyMuPDF, see docs/PLAN.md §4)
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "pytesseract>=0.3.13",
    "pillow>=10.4",
    # llm + web
    "google-genai>=0.3",
    "openai>=1.40",
    "httpx>=0.27",
    # platform
    "platformdirs>=4.2",
    "filelock>=3.16",
    "psutil>=6",
    "keyring>=25.3",
]

[project.scripts]
ema = "ema.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6.8",
    "pyright>=1.1.383",
    "import-linter>=2.1",
    "pre-commit>=3.8",
    "lxml-stubs>=0.5.1",
    "xlwt>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ema"]

# ----------------------------------------------------------------- gates
# The standards table in docs/PLAN.md §6.3 is enforced here, not in prose.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # pep8-naming
    "C90",      # mccabe complexity
    "PL",       # pylint subset
    "RUF",
]
ignore = [
    "PLR2004",  # magic values: too noisy for domain constants (factors, limits)
    # The domain is Romanian: diacritics, „quotes" and en dashes are correct here,
    # in identifiers' docstrings as much as in user-facing strings.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-statements = 50
max-returns = 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "PLR2004"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "golden: runs against the real reference library; needs EMA_REFERENCE (skipped without it)",
]
